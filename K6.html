<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K6 - Xử lý sự kiện bàn phím</title>

<script src="https://cdn.tailwindcss.com"></script>


<style>

#box{

    width:100px;
    height:100px;
    background:#4f46e5;
    position:relative;
    left:250px;
    top:0px;
    border-radius:15px;
    transition:0.2s;

}

</style>


</head>


<body class="bg-gray-100">


<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">


<h1 class="text-3xl font-bold text-center text-indigo-700 mb-6">

Bài K6 - Xử Lý Sự Kiện Bàn Phím

</h1>



<p class="text-center mb-5">

Sử dụng phím:

<span class="font-bold text-red-600">
↑
</span>

để đi lên và

<span class="font-bold text-red-600">
↓
</span>

để đi xuống

</p>



<div id="box"></div>



<div class="text-center mt-10">

<a href="bt36.html"
class="bg-green-600 text-white px-6 py-3 rounded-lg">

← Quay về Trang Chủ

</a>

</div>


</div>



<script>


let position = 0;


document.addEventListener("keydown", function(event){



let box = document.getElementById("box");



if(event.key === "ArrowUp"){


    position -= 20;


    box.style.top = position + "px";


}



else if(event.key === "ArrowDown"){


    position += 20;


    box.style.top = position + "px";


}



});



</script>



</body>

</html>
