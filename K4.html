<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K4 - Phân trang danh sách</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">


<h1 class="text-3xl font-bold text-center text-indigo-700 mb-6">

Bài K4 - Phân Trang Danh Sách

</h1>



<ul id="list"
class="space-y-2 mb-6">

</ul>



<div id="pagination"
class="flex justify-center gap-3">

</div>



<div class="text-center mt-8">

<a href="bt36.html"
class="bg-green-600 text-white px-6 py-3 rounded-lg">

← Quay về Trang Chủ

</a>

</div>


</div>



<script>


// Tạo danh sách 50 mục

let data = [];

for(let i = 1; i <= 50; i++){

    data.push("Mục số " + i);

}



let currentPage = 1;

const itemPerPage = 10;



function displayList(page){


    let list = document.getElementById("list");

    list.innerHTML = "";



    let start = (page - 1) * itemPerPage;

    let end = start + itemPerPage;



    let items = data.slice(start,end);



    items.forEach(item=>{


        let li = document.createElement("li");


        li.textContent = item;


        li.className =
        "bg-gray-100 p-3 rounded-lg";


        list.appendChild(li);


    });


}



function createPagination(){


    let pagination =
    document.getElementById("pagination");


    pagination.innerHTML="";


    let totalPage =
    Math.ceil(data.length/itemPerPage);



    for(let i=1;i<=totalPage;i++){


        let button =
        document.createElement("button");


        button.textContent=i;


        button.className =
        "bg-indigo-600 text-white px-4 py-2 rounded-lg";


        button.onclick=function(){


            currentPage=i;

            displayList(currentPage);


        };


        pagination.appendChild(button);


    }


}



displayList(currentPage);

createPagination();


</script>


</body>

</html>
